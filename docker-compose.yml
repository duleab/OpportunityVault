version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: opportunityvault-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: opportunityvault
      POSTGRES_PASSWORD: opportunityvault
      POSTGRES_DB: opportunityvault
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
