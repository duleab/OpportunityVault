<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>OpportunityVault — AI-Powered Opportunity Tracker</title>
    <meta name="description" content="Track scholarships, fellowships, jobs, and internships in one place. Paste raw text and AI extracts all details. Never miss a deadline again." />
    <meta name="keywords" content="scholarship tracker, fellowship, internship, job opportunities, AI extraction, deadline tracker" />
    <meta name="author" content="OpportunityVault" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="OpportunityVault — AI-Powered Opportunity Tracker" />
    <meta property="og:description" content="Track scholarships, fellowships, jobs, and internships in one place. Paste raw text and AI extracts all details." />
    <meta property="og:site_name"   content="OpportunityVault" />

    <!-- Twitter -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="OpportunityVault" />
    <meta name="twitter:description" content="AI-powered tracker for scholarships, fellowships, jobs, and internships." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts: Inter (primary) + JetBrains Mono (code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Theme color -->
    <meta name="theme-color" content="#ffffff" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
